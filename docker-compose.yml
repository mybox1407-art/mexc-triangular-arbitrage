services:
  arbitrage-bot:
    build: .
    container_name: mexc-triangular-arbitrage
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cpus: 2
    mem_limit: 1g
    volumes:
      - ./data:/app/data
    networks:
      - arb_network

  db:
    image: postgres:16-alpine
    container_name: mexc-arb-postgres
    environment:
      POSTGRES_DB: mexc_arb
      POSTGRES_USER: arb
      POSTGRES_PASSWORD: arb_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb -d mexc_arb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - arb_network

volumes:
  postgres_data:

networks:
  arb_network:
